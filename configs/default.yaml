scene: sample
extract_frames:
  fps: 3
  quality: 95
  max_dimension: 1920
  window_size: 1
  blur_percentile: 10.0
  duplicate_threshold: 0.985
  max_frames: 450
  min_frames_warn: 120
  contact_sheet_cols: 8
  contact_sheet_rows: 6
sfm:
  camera_model: SIMPLE_RADIAL
  use_gpu: true
  matcher: sequential
  mapper: incremental
  min_registered_ratio: 0.85
  feature_type: SIFT
  sequential_overlap: 20
align:
  input_model: colmap_runs/E3/sparse/0
  eye_level_height_m: 1.45
  chest_level_height_m: 1.15
  max_floor_angle_deg: 8.0
  min_inlier_ratio: 0.015
  max_planes: 6
  floor_height_manual: null
  dist_thresh: 0.05
alignment:
  input_model: colmap_runs/E3/sparse/0
  method: gravity
  phone_height_m: 1.45
  eye_level_height_m: 1.45
  chest_level_height_m: 1.15
  max_floor_angle_deg: 8.0
  min_inlier_ratio: 0.015
  max_planes: 6
  floor_height_manual: null
  dist_thresh: 0.05
  scale_reference_m: null
  ceiling_height_m: 4.1
splat:
  backend: brush
  preset: final
  eval_ratio: 0.1
  iterations: 30000
  sh_degree: 3
  densify_until_iter: 15000
  position_lr_init: 0.00016
  scaling_lr: 0.005
postprocess:
  compress: true
  max_gaussians: 2000000
  max_splats: 0
  crop_margin_m: 4.0
  walkable_radius_m: 1.5
  min_opacity: 0.05
  max_scale_m: 0.5
  occupancy_cell_size_m: 0.1
  occupancy_min_points: 8
  occupancy_inflation_m: 0.12
occupancy:
  slab_y_min_m: 0.20
  slab_y_max_m: 1.40
  voxel_size_m: 0.10
  occ_sfm_min_track: 3
  occ_sfm_max_error: 1.0
  occ_splat_min_opacity: 0.5
  occ_splat_max_scale: 0.15
  occ_min_support: 2
  free_min_cameras: 2
  free_ray_step_m: 0.05
  free_ray_stop_before_point_m: 0.15
  free_sfm_subsample: 1
  collapse_free_slab_ratio: 0.60
  remove_isolated_occupied: true
  inflation_m: 0.07
  player_radius_m: 0.08
  total_body_radius_m: 0.15
  unknown_ok_radius_m: 0.30
convention:
  up: Y
  handedness: right
  units: metres
  floor_y: 0.0
